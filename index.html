<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NOVA AI - ذكاء اصطناعي حقيقي وآمن</title>

  <meta
    name="description"
    content="NOVA AI هو مساعد ذكاء اصطناعي حقيقي وسهل الاستخدام، تم تطويره بواسطة محمد أحمد خلف."
  >

  <meta
    name="keywords"
    content="NOVA AI, Nova AI, ذكاء اصطناعي, مساعد ذكاء اصطناعي"
  >

  <link
    rel="canonical"
    href="https://nova-ai-gilt-eight.vercel.app/"
  >

  <link
    rel="icon"
    type="image/png"
    href="/nova-favicon-64.png"
  >

  <link
    rel="apple-touch-icon"
    href="/nova-icon-192.png"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <div id="auth" class="auth">

    <div class="card">

      <h1 class="auth-title">

        <img
          src="/nova-icon-192.png"
          class="auth-logo"
          alt="NOVA AI"
        >

        NOVA <span>AI</span>

      </h1>

      <p>ذكاء اصطناعي حقيقي وآمن</p>

      <div class="tabs">

        <button
          id="lt"
          class="active"
          type="button"
        >
          تسجيل الدخول
        </button>

        <button
          id="st"
          type="button"
        >
          إنشاء حساب
        </button>

      </div>

      <form id="af">

        <input
          id="name"
          class="hide"
          placeholder="الاسم"
          autocomplete="name"
        >

        <input
          id="email"
          type="email"
          placeholder="البريد الإلكتروني"
          autocomplete="email"
          required
        >

        <input
          id="pass"
          type="password"
          placeholder="كلمة المرور"
          autocomplete="current-password"
          required
        >

        <label class="remember">

          <input
            id="remember"
            type="checkbox"
            checked
          >

          تذكر الحساب على هذا الجهاز

        </label>

        <button
          type="submit"
          class="primary"
          id="as"
        >
          دخول
        </button>

        <div id="ae" class="err"></div>

      </form>

      <small>
        الحساب التجريبي يُحفظ على هذا الجهاز فقط.
      </small>

    </div>

  </div>


  <!-- ================= APP ================= -->

  <div id="app" class="app hide">

    <!-- ================= SIDEBAR ================= -->

    <aside id="sidebar">

      <!-- زر إغلاق السايد بار -->

      <button
        id="sidebarClose"
        class="sidebar-close"
        type="button"
        aria-label="إغلاق القائمة"
      >
        ×
      </button>


      <div class="brand">

        <img
          src="/nova-icon-192.png"
          class="nova-logo"
          alt="NOVA AI"
        >

        <div>

          <b>
            NOVA <span>AI</span>
          </b>

          <small>
            AI Assistant
          </small>

        </div>

      </div>


      <button
        id="new"
        type="button"
        class="new-chat"
      >
        ＋ محادثة جديدة
      </button>


      <div id="list"></div>


      <div class="bottom">

        <button
          id="theme"
          type="button"
        >
          ☀️ الوضع الفاتح
        </button>

        <button
          id="logout"
          type="button"
        >
          ⇥ تسجيل الخروج
        </button>

      </div>

    </aside>


    <!-- OVERLAY -->

    <div
      id="sidebarOverlay"
      class="sidebar-overlay"
    ></div>


    <!-- ================= MAIN ================= -->

    <main>

      <!-- HEADER -->

      <header>

        <!-- زر السايد بار -->

        <button
          id="sidebarToggle"
          class="sidebar-toggle"
          type="button"
          aria-label="فتح السايد بار"
          title="فتح السايد بار"
        >
          ☰
        </button>


        <div class="chat-brand">

          <img
            src="/nova-icon-192.png"
            class="chat-logo"
            alt="NOVA AI"
          >

          <div>

            <strong>
              NOVA AI
            </strong>

            <small>
              ● متصل
            </small>

          </div>

        </div>


        <div id="user"></div>

      </header>


      <!-- ================= MESSAGES ================= -->

      <section id="msgs"></section>


      <!-- ================= IMAGE PREVIEW ================= -->

      <div
        id="prev"
        class="hide"
      >

        <img
          id="pi"
          alt="معاينة الصورة"
        >

        <button
          id="rm"
          type="button"
          aria-label="إزالة الصورة"
        >
          ×
        </button>

      </div>


      <!-- ================= CHAT INPUT ================= -->

      <form id="cf">

        <!-- ATTACH -->

        <div class="attach-menu">

          <button
            type="button"
            id="attachBtn"
            class="attach"
            aria-label="إرفاق"
            title="إرفاق صورة"
          >
            ＋
          </button>

          <div
            id="attachOptions"
            class="attach-options hide"
          >

            <button
              type="button"
              id="addImageBtn"
            >
              🖼️ إضافة صورة
            </button>

          </div>

          <input
            id="img"
            type="file"
            accept="image/*"
            hidden
          >

        </div>


        <!-- TEXT -->

        <textarea
          id="text"
          rows="1"
          placeholder="اكتب رسالتك إلى NOVA AI..."
          autocomplete="off"
        ></textarea>


        <!-- SEND -->

        <button
          class="send"
          type="submit"
          aria-label="إرسال"
          title="إرسال"
        >
          ➤
        </button>

      </form>


      <!-- FOOTER -->

      <footer>

        لا ترسل معلومات شخصية حساسة.
        NOVA AI يرفض المحتوى غير المناسب والخطير وغير القانوني.

      </footer>

    </main>

  </div>


  <script src="app.js"></script>

</body>

</html>
