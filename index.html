<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOVA AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b12;color:#fff;min-height:100vh}
    .app{display:flex;min-height:100vh}.side{width:250px;background:#11111b;border-left:1px solid #252535;padding:18px;display:flex;flex-direction:column}
    .brand{font-size:25px;font-weight:800;margin-bottom:20px}.brand span{color:#9b6cff}.new{border:0;border-radius:14px;padding:13px;background:#9b6cff;color:#fff;font-size:15px;cursor:pointer}
    .hint{color:#8e8e9e;font-size:13px;line-height:1.7;margin-top:auto}.main{flex:1;display:flex;flex-direction:column;min-width:0}
    header{height:70px;border-bottom:1px solid #252535;display:flex;align-items:center;padding:0 22px;font-weight:700}.status{margin-right:auto;color:#7ee2a8;font-size:12px}
    #chat{flex:1;overflow:auto;padding:30px 8%;display:flex;flex-direction:column;gap:18px}.welcome{text-align:center;margin:auto;max-width:650px}.welcome h1{font-size:44px;margin:0 0 10px}.welcome p{color:#aaaabd}
    .msg{max-width:800px;padding:14px 17px;border-radius:18px;line-height:1.8;white-space:pre-wrap}.user{align-self:flex-start;background:#29233d}.ai{align-self:flex-end;background:#171720;border:1px solid #292936}
    .composer{padding:18px 8%;border-top:1px solid #252535;background:#0b0b12}.box{display:flex;gap:10px;background:#15151f;border:1px solid #303044;border-radius:18px;padding:8px}
    textarea{flex:1;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:12px;font-size:15px;min-height:48px}.send{width:48px;height:48px;border:0;border-radius:14px;background:#9b6cff;color:#fff;cursor:pointer;font-size:20px}
    @media(max-width:700px){.side{display:none}#chat,.composer{padding-left:14px;padding-right:14px}.welcome h1{font-size:34px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">NOVA <span>AI</span></div><button class="new" id="newChat">＋ محادثة جديدة</button><div class="hint">ذكاء اصطناعي حقيقي متصل بـ OpenAI.<br>مفتاح API لا يوجد داخل هذه الصفحة.</div></aside>
  <main class="main">
    <header>Nova AI <span class="status">● متصل</span></header>
    <section id="chat"><div class="welcome" id="welcome"><h1>مرحبًا 👋</h1><p>أنا Nova. اسألني أي سؤال، وسأحاول مساعدتك بأفضل إجابة.</p></div></section>
    <div class="composer"><div class="box"><textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea><button class="send" id="send">➤</button></div></div>
  </main>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input');
let history=[];
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function send(){
 const text=input.value.trim(); if(!text)return;
 document.getElementById('welcome')?.remove(); add(text,'user'); input.value=''; input.style.height='auto';
 const loading=add('يفكر…','ai');
 history.push({role:'user',content:text});
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
   const data=await r.json(); if(!r.ok) throw new Error(data.error||'حدث خطأ');
   loading.textContent=data.reply||'لم يصل رد.';
   history.push({role:'assistant',content:data.reply});
 }catch(e){loading.textContent='تعذر الاتصال بالذكاء الاصطناعي: '+e.message}
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.getElementById('newChat').onclick=()=>{history=[];chat.innerHTML='<div class="welcome" id="welcome"><h1>محادثة جديدة ✨</h1><p>اكتب رسالتك وسأجيبك.</p></div>'};
</script>
</body>
</html>
